name: Daily sign in Baha

on:
  workflow_dispatch:

concurrency:
  group: bahasign-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bahasign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run sign-in script
        id: sign_in
        continue-on-error: true
        env:
          USER_ACCOUNT: ${{ secrets.ACCOUNT }}
          USER_PASSWORD: ${{ secrets.PASSWORD }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -o pipefail
          python -u bahasign.py 2>&1 | tee result.txt

      - name: Update README
        if: always()
        run: |
          TIME=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          RESULT=$(grep -E '^(✅|❌)' result.txt 2>/dev/null | tail -n 1 || true)
          DAYS=$(grep -E '^📅' result.txt 2>/dev/null | tail -n 1 || true)

          if echo "$RESULT" | grep -q '^✅'; then
            STATUS="$RESULT"
          elif echo "$RESULT" | grep -q '^❌'; then
            STATUS="$RESULT"
          else
            STATUS="⚠️ 執行異常，請查看 Actions 日誌"
          fi

          if [ -z "$DAYS" ]; then
            DAYS="📅 連續簽到：暫無資料"
          fi

          cat > README.md <<EOF
          # 巴哈姆特自動簽到

          | 項目 | 狀態 |
          | --- | --- |
          | 上次執行時間 | $TIME |
          | 執行結果 | $STATUS |
          | 簽到天數 | $DAYS |

          > 簽到天數由巴哈姆特 API 回傳，代表目前連續簽到天數。
          > 此頁面由 GitHub Actions 自動更新。
          EOF

      - name: Save status and notification state
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          if [ -f .last-success-notification ]; then
            git add .last-success-notification
          fi
          if git diff --cached --quiet; then
            echo "No status changes to commit."
            exit 0
          fi
          git commit -m "Update sign-in status: $(TZ='Asia/Taipei' date '+%Y/%m/%d %H:%M:%S')"
          git push

      - name: Mark workflow failed when sign-in or notification failed
        if: steps.sign_in.outcome == 'failure'
        run: exit 1
